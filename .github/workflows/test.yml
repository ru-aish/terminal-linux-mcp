name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tmux runtime prerequisite
        run: |
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            brew install tmux
          else
            sudo apt-get update
            sudo apt-get install -y tmux
          fi

      - name: Check bootstrap interfaces
        run: |
          bash -n start.sh setup.sh store.sh install.sh doctor.sh
          ./start.sh --help
          ./setup.sh --help
          ./store.sh --help
          ./install.sh --help
          ./doctor.sh || true

      - name: Install through project setup
        env:
          PYTHON_BIN: python
        run: |
          ./setup.sh --dev
          .venv/bin/pytest --version
          ./store.sh --check
          ./start.sh --check --local-only
          ./doctor.sh || true

      - name: Compile Python files
        run: |
          .venv/bin/python -m py_compile \
            terminal_mcp.py \
            scripts/smoke_test.py \
            tests/test_terminal_mcp.py \
            tests/test_http_persistence.py

      - name: Run tests
        run: .venv/bin/pytest -q
